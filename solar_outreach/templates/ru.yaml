first:
  subject: "Запрос о фотоэлектрической станции - {ref}"
  intro_private: |-
    Здравствуйте,

    Меня зовут {name}, я представляю {company}. Наша компания владеет и управляет фотоэлектрическими станциями по всей Болгарии. Сейчас мы ищем для покупки ещё одну действующую станцию мощностью 1-3 МВт.

    Я увидел Ваше объявление о продаже: {description} и буду рад узнать подробнее:
  broker_extra: |-
    Если у Вас есть другие действующие станции мощностью 1-3 МВт, буду рад получить информацию о них. Помимо готовых станций, мы также рассматриваем земельные участки, пригодные для строительства фотоэлектрической станции, с разрешением на строительство и обеспеченной мощностью для присоединения к электрической сети.

    Прошу также сообщить Ваши условия сотрудничества: комиссия, эксклюзивность и порядок проведения сделки. Нам хотелось бы обсудить их сразу.
  questions:
    - Работает ли станция сейчас и актуально ли объявление?
    - Какова присоединённая мощность и каковы условия договора о присоединении?
    - "Есть ли основные документы: документ о праве собственности на землю, разрешение на строительство и договор о присоединении с электрораспределительной компанией?"
    - Какова запрашиваемая цена?
  outro: |-
    Если у Вас возникнут вопросы, Вы можете связаться со мной по электронной почте или в WhatsApp и Viber по указанному телефону. Буду рад обсудить все условия. Заранее благодарю!

  # a project with a building permit (title names the permit, not an operating plant): overrides subject/intro/questions
  permit:
    subject: "Запрос о проекте фотоэлектрической станции - {ref}"
    intro_private: |-
      Здравствуйте,

      Меня зовут {name}, я представляю {company}. Наша компания владеет и управляет фотоэлектрическими станциями по всей Болгарии. Помимо действующих станций, мы рассматриваем проекты мощностью 1-3 МВт с выданным разрешением на строительство.

      Я увидел Ваше объявление о продаже проекта: {description} и буду рад узнать подробнее:
    questions:
      - Актуально ли объявление и на какой стадии находится проект?
      - До какого срока действует разрешение на строительство?
      - Какова одобренная мощность присоединения и заключён ли договор о присоединении с электрораспределительной компанией?
      - Земля в собственности или в аренде?
      - Какова запрашиваемая цена, что в неё входит и продаётся ли проект вместе с компанией?

  general:
    subject: Запрос о фотоэлектрических станциях и земельных участках
    intro: |-
      Здравствуйте,

      Меня зовут {name}, я представляю {company}. Наша компания владеет и управляет фотоэлектрическими станциями по всей Болгарии. Мы ищем для покупки готовые действующие фотоэлектрические станции мощностью 1-3 МВт по всей стране. Если у Вас есть такие станции в портфеле, прошу прислать информацию о них.

      Помимо готовых станций, мы также рассматриваем земельные участки, пригодные для строительства фотоэлектрической станции, с разрешением на строительство и обеспеченной мощностью для присоединения к электрической сети.

      По каждой станции или участку буду признателен за следующую информацию:
    questions:
      - Работают ли готовые станции сейчас?
      - Какова присоединённая мощность и каковы условия договора о присоединении?
      - "Есть ли основные документы: документ о праве собственности на землю, разрешение на строительство и договор о присоединении с электрораспределительной компанией?"
      - Какова запрашиваемая цена?
    terms: |-
      Прошу также сообщить Ваши условия сотрудничества: комиссия, эксклюзивность и порядок проведения сделки. Нам хотелось бы обсудить их сразу.

second:
  intro: "Спасибо за информацию. Чтобы оценить станцию, прошу уточнить ещё:"
  questions:
    "5 год ввода": Год ввода в эксплуатацию.
    "6 выработка/выручка": Выработка и выручка за последние 2-3 года, по возможности с отчётом или фактурами.
    "7 режим продажи": "Режим продажи: преференциальный тариф и до какого года, или свободный рынок и кто торговый посредник."
    "8 панели": Марка и модель панелей и инверторов.
    "9 земля собств/аренда": Земля в собственности или в аренде? Если в аренде, до какого срока и у кого.
    "10 актив/SPV, обременения": Продаётся сама станция или компания; есть ли кредиты, обременения, залоги?
    docs: Пожалуйста, пришлите копии документа о праве собственности на землю, разрешения на строительство и договора о присоединении на {email}.
  outro: Спасибо!

followup:
  body: |-
    Здравствуйте,

    Возвращаюсь к своему запросу от {date}. Объявление ещё актуально?
  body_general: |-
    Здравствуйте,

    Возвращаюсь к своему запросу от {date}. Есть ли у Вас подходящие станции или участки?
  body_reply: |-
    Здравствуйте,

    Возвращаюсь к своему сообщению от {date} с несколькими дополнительными вопросами. Буду рад ответу, когда Вам будет удобно, даже если только на часть из них.
