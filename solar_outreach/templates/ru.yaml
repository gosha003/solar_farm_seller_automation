signature: |-
  С уважением,
  Иван Петров
  Пример Солар ЕООД
  тел./Viber/WhatsApp: +359 88 000 0000
  owner@example.com

first:
  subject: "Запрос о фотоэлектрической станции - {ref}"
  intro_private: |-
    Здравствуйте,

    Меня зовут Иван Петров, я представляю Пример Солар ЕООД. Наша компания уже владеет и управляет фотоэлектрическими станциями по всей Болгарии, а сейчас мы ищем для покупки ещё одну действующую станцию мощностью 1-2 МВт.

    Я увидел Ваше объявление о продаже: {description} и буду рад узнать подробнее:
  intro_broker: |-
    Здравствуйте,

    Меня зовут Иван Петров, я представляю Пример Солар ЕООД. Наша компания уже владеет и управляет фотоэлектрическими станциями по всей Болгарии. Мы ищем готовые действующие фотоэлектрические станции мощностью 1-2 МВт по всей Болгарии. Если у Вас есть такие в портфеле, пожалуйста, пришлите информацию о них.

    Я увидел Ваше объявление о продаже: {description}. По каждой станции хотел бы узнать:
  questions:
    - Работает ли станция сейчас и актуально ли объявление?
    - Какова присоединённая мощность и каковы условия договора о присоединении (капацитет)?
    - "Есть ли основные документы: документ о праве собственности на землю (на компанию, которой принадлежит станция), разрешение на строительство и договор о присоединении с электроразпределительной компанией?"
    - Какова запрашиваемая цена?
  outro: |-
    Сейчас я за границей, поэтому мне удобнее всего общаться письменно. Заранее благодарю!

second:
  intro: "Спасибо за информацию. Чтобы оценить станцию, прошу уточнить ещё:"
  questions:
    "5 год ввода": Год ввода в эксплуатацию.
    "6 выработка/выручка": Выработка и выручка за последние 2-3 года (по возможности с отчётом или фактурами).
    "7 режим продажи": "Режим продажи: преференциальный тариф (до какого года) или свободный рынок; кто торговый посредник."
    "8 панели": Марка и модель панелей и инверторов.
    "9 земля собств/аренда": Земля в собственности или в аренде (если в аренде - до какого срока и у кого)?
    "10 актив/SPV, обременения": Продаётся сама станция или компания (SPV); есть ли кредиты, обременения, залоги?
    docs: Пожалуйста, пришлите копии документов из п. 3 на owner@example.com.
  outro: Спасибо!

followup:
  body: |-
    Здравствуйте,

    Возвращаюсь к своему запросу от {date}. Объявление ещё актуально?
