first:
  subject: "Inquiry about a photovoltaic plant - {ref}"
  intro_private: |-
    Hello,

    My name is Ivan Petrov and I represent Example Solar EOOD. Our company already owns and operates photovoltaic plants across Bulgaria, and we are now looking to acquire an additional operating plant of 1-2 MW.

    I saw your listing for {description} and would be glad to learn more:
  intro_broker: |-
    Hello,

    My name is Ivan Petrov and I represent Example Solar EOOD. Our company already owns and operates photovoltaic plants across Bulgaria. We are looking for operating photovoltaic plants of 1-2 MW anywhere in Bulgaria. If you have such plants in your portfolio, please send me information about them.

    I saw your listing for {description}. For each plant I would like to know:
  questions:
    - Is the plant operating at the moment, and is the listing still current?
    - What is the connected capacity and what are the terms of the grid connection agreement?
    - "Are the main documents in place: title to the land (held by the company that owns the plant), building permit, and the grid connection agreement with the distribution company?"
    - What is the asking price?
  outro: |-
    I am currently abroad, so written communication suits me best. Thank you in advance!

second:
  intro: "Thank you for the information. To evaluate the plant, could you please also clarify:"
  questions:
    "5 год ввода": Year of commissioning.
    "6 выработка/выручка": Energy produced and revenue for the last 2-3 years (if possible, with a sample report or invoices).
    "7 режим продажи": "Sales regime: feed-in tariff (until which year) or free market; who is the trading intermediary."
    "8 панели": Make and model of the panels and inverters.
    "9 земля собств/аренда": Is the land owned or leased (if leased - until when and from whom)?
    "10 актив/SPV, обременения": Is the plant itself for sale or the company (SPV); are there any loans, encumbrances or pledges?
    docs: Please send copies of the documents from item 3 to owner@example.com.
  outro: Thank you!

followup:
  body: |-
    Hello,

    I am following up on my inquiry of {date}. Is the listing still current?
