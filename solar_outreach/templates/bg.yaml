# Раздел 7 ТЗ. {description} и {ref} подставляются из объявления; вопросы нумеруются автоматически.
signature: |-
  С уважение,
  Иван Петров
  Пример Солар ЕООД
  тел./Viber/WhatsApp: +359 88 000 0000
  owner@example.com

first:
  subject: "Запитване за фотоволтаична централа - {ref}"
  intro_private: |-
    Здравейте,

    Казвам се Иван Петров, представител на Пример Солар ЕООД. Дружеството ни вече притежава и управлява фотоволтаични централи в цяла България, а сега търсим да закупим допълнителна действаща централа с мощност 1-2 MW.

    Видях Вашата обява за {description} и ще се радвам да науча повече:
  intro_broker: |-
    Здравейте,

    Казвам се Иван Петров, представител на Пример Солар ЕООД. Дружеството ни вече притежава и управлява фотоволтаични централи в цяла България. Търсим готови действащи фотоволтаични централи с мощност 1-2 MW в цялата страна. Ако имате такива в портфолиото си, моля, изпратете ми информация за тях.

    Видях Вашата обява за {description}. За всяка централа ще се радвам да науча:
  questions:
    - Централата действаща ли е в момента и обявата актуална ли е?
    - Каква е присъединената мощност и какви са условията по договора за присъединяване (капацитет)?
    - "Налични ли са основните документи: документ за собственост върху земята (на дружеството, което притежава централата), разрешение за строеж и договор за присъединяване с електроразпределителното дружество?"
    - Каква е исканата цена?
  outro: |-
    В момента съм в чужбина, затова ми е най-удобно да общуваме писмено. Благодаря предварително!

second:
  intro: "Благодаря за информацията. За да мога да оценя централата, моля да уточните още:"
  questions:   # ключ = пункт раздела 3 (колонка таблицы); спрашиваем только то, на что нет ответа
    "5 год ввода": Година на въвеждане в експлоатация.
    "6 выработка/выручка": Произведена енергия и приходи за последните 2-3 години (ако е възможно, с примерна справка или фактури).
    "7 режим продажи": "Режим на продажба: преференциална цена (до коя година) или свободен пазар; кой е търговският посредник."
    "8 панели": Марка и модел на панелите и инверторите.
    "9 земля собств/аренда": Земята собствена ли е или е под наем (ако е под наем - до кога и от кого).
    "10 актив/SPV, обременения": Продава се самата централа или дружеството (SPV); има ли кредити, тежести, залози?
    docs: Моля, изпратете копия на документите от т. 3 на owner@example.com.
  outro: Благодаря!

followup:
  body: |-
    Здравейте,

    Връщам се по повод запитването ми от {date}. Все още ли е актуална обявата?
