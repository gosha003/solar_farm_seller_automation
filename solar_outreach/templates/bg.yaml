# Letter templates. {description} and {ref} come from the listing, {name}/{company}/{phone}/{email} from config; questions are numbered automatically.
signature: |-
  С уважение,
  {name}
  {company}
  тел./Viber/WhatsApp: {phone}
  {email}

first:
  subject: "Запитване за фотоволтаична централа - {ref}"
  intro_private: |-
    Здравейте,

    Казвам се {name}, представител на {company}. Дружеството ни притежава и управлява фотоволтаични централи в цяла България. Сега търсим да закупим допълнителна действаща централа с мощност 1-3 MW.

    Видях Вашата обява за {description} и ще се радвам да науча повече:
  # to a broker: the same letter about the listing + a question about other plants in their portfolio at the end
  broker_extra: |-
    Ако имате други действащи централи с мощност 1-3 MW, ще се радвам да получа информация за тях. Освен готови централи, разглеждаме и поземлени имоти, подходящи за изграждане на фотоволтаична централа, с издадено разрешение за строеж и осигурен капацитет за присъединяване към електроразпределителната мрежа.

    Бихте ли ми съобщили и на какви условия за сътрудничество работите (комисиона, ексклузивност, ред на провеждане на сделката)? Предпочитаме да ги уточним още в началото.
  questions:
    - Централата действаща ли е в момента и обявата актуална ли е?
    - Каква е присъединената мощност и какви са условията по договора за присъединяване?
    - "Налични ли са основните документи: документ за собственост върху земята, разрешение за строеж и договор за присъединяване с електроразпределителното дружество?"
    - Каква е исканата цена?
  outro: |-
    Ако имате въпроси, можете да се свържете с мен по имейл или по WhatsApp и Viber на посочения телефон. Ще се радвам да обсъдим всички условия. Благодаря предварително!

  # to a broker found by search (not via a listing): a general letter that always asks the price
  general:
    subject: Запитване за фотоволтаични централи и терени
    intro: |-
      Здравейте,

      Казвам се {name}, представител на {company}. Дружеството ни притежава и управлява фотоволтаични централи в цяла България. Търсим да закупим готови действащи фотоволтаични централи с мощност 1-3 MW в цялата страна. Ако имате такива в портфолиото си, моля, изпратете ми информация за тях.

      Освен готови централи, разглеждаме и поземлени имоти, подходящи за изграждане на фотоволтаична централа, с издадено разрешение за строеж и осигурен капацитет за присъединяване към електроразпределителната мрежа.

      За всяка централа или имот ще съм благодарен за следната информация:
    questions:
      - Готовите централи действащи ли са в момента?
      - Каква е присъединената мощност и какви са условията по договора за присъединяване?
      - "Налични ли са основните документи: документ за собственост върху земята, разрешение за строеж и договор за присъединяване с електроразпределителното дружество?"
      - Каква е исканата цена?
    terms: |-
      Бихте ли ми съобщили и на какви условия за сътрудничество работите (комисиона, ексклузивност, ред на провеждане на сделката)? Предпочитаме да ги уточним още в началото.

second:
  intro: "Благодаря за информацията. За да мога да оценя централата, моля да уточните още:"
  questions:   # key = checklist item (sheet column); only unanswered items are asked
    "5 год ввода": Година на въвеждане в експлоатация.
    "6 выработка/выручка": Произведена енергия и приходи за последните 2-3 години, ако е възможно с примерна справка или фактури.
    "7 режим продажи": "Режим на продажба: преференциална цена и до коя година, или свободен пазар и кой е търговският посредник."
    "8 панели": Марка и модел на панелите и инверторите.
    "9 земля собств/аренда": Земята собствена ли е или е под наем? Ако е под наем, до кога и от кого.
    "10 актив/SPV, обременения": Продава се самата централа или дружеството; има ли кредити, тежести, залози?
    docs: Моля, изпратете копия на документите от т. 3 на {email}.
  outro: Благодаря!

followup:
  body: |-
    Здравейте,

    Връщам се по повод запитването ми от {date}. Все още ли е актуална обявата?
  body_general: |-
    Здравейте,

    Връщам се по повод запитването ми от {date}. Разполагате ли с подходящи централи или терени?
