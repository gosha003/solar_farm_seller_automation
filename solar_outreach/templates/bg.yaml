# Раздел 7 ТЗ. {description} и {ref} подставляются из объявления; вопросы нумеруются автоматически.
signature: |-
  С уважение,
  Иван Петров
  Пример Солар ЕООД
  тел./Viber/WhatsApp: +359 88 000 0000
  owner@example.com

first:
  subject: "Запитване за фотоволтаична централа - {ref}"
  intro_private: |-
    Здравейте,

    Казвам се Иван Петров, представител на Пример Солар ЕООД. Дружеството ни притежава и управлява фотоволтаични централи в цяла България. Сега търсим да закупим допълнителна действаща централа с мощност 1-2 MW.

    Видях Вашата обява за {description} и ще се радвам да науча повече:
  # брокеру: то же письмо про конкретную обяву + в конце вопрос про другие станции в портфеле
  broker_extra: Ако имате и други действащи централи с мощност 1-2 MW, ще се радвам да получа информация и за тях.
  questions:
    - Централата действаща ли е в момента и обявата актуална ли е?
    - Каква е присъединената мощност и какви са условията по договора за присъединяване?
    - "Налични ли са основните документи: документ за собственост върху земята, разрешение за строеж и договор за присъединяване с електроразпределителното дружество?"
    - Каква е исканата цена?
  outro: |-
    При въпроси не се колебайте да се свържете с мен по имейл или по WhatsApp и Viber на посочения телефон. Ще се радвам да обсъдим всички условия. Благодаря предварително!

second:
  intro: "Благодаря за информацията. За да мога да оценя централата, моля да уточните още:"
  questions:   # ключ = пункт раздела 3 (колонка таблицы); спрашиваем только то, на что нет ответа
    "5 год ввода": Година на въвеждане в експлоатация.
    "6 выработка/выручка": Произведена енергия и приходи за последните 2-3 години, ако е възможно с примерна справка или фактури.
    "7 режим продажи": "Режим на продажба: преференциална цена и до коя година, или свободен пазар и кой е търговският посредник."
    "8 панели": Марка и модел на панелите и инверторите.
    "9 земля собств/аренда": Земята собствена ли е или е под наем? Ако е под наем, до кога и от кого.
    "10 актив/SPV, обременения": Продава се самата централа или дружеството; има ли кредити, тежести, залози?
    docs: Моля, изпратете копия на документите от т. 3 на owner@example.com.
  outro: Благодаря!

followup:
  body: |-
    Здравейте,

    Връщам се по повод запитването ми от {date}. Все още ли е актуална обявата?
