# Business parameters. The code hardcodes none of these.
# Values here are public examples: a deployment overrides them in config.local.yaml (gitignored),
# which load_config() merges on top of this file.
# Real sending is controlled ONLY by the DRY_RUN env var (default true), never by this file.

approval_mode: manual          # default; the live mode is in the «Настройки» sheet tab and is switched with /auto on|off

owner:                         # letters may state only these facts about the buyer
  name: {bg: Иван Петров, en: Ivan Petrov, ru: Иван Петров}
  company: {bg: Пример Солар ЕООД, en: Example Solar EOOD, ru: Пример Солар ЕООД}
  email: owner@example.com
  phone: "+359 88 000 0000"    # the only number sellers ever get
  timezone: America/Toronto
  facts:                       # what the LLM may tell sellers about the buyer, and nothing beyond it
    - The company owns and operates photovoltaic plants in Bulgaria. Never state capacities, locations or the number of plants.
    - The goal is to buy a ready, operating 1-3 MW PV plant, or a 1-3 MW project with a building permit.
    - "Contact: email and WhatsApp/Viber on the phone above. Never say where the buyer is located."

criteria:                      # which listings qualify
  min_kwp: 1000
  max_kwp: 3000
  price_per_kwp_eur:
    preferred: [800, 900]
    acceptable: [700, 1000]
    suspicious_below: 600      # still write, but flag
    skip_above: 1100           # do not write when the price is known and above this
  min_year_preferred: 2018
  regime: any                  # feed-in tariff or free market (IBEX)
  region: all_bulgaria
  status_required: operating_or_permit   # operating plants and projects with a building permit

eur_bgn: 1.95583               # fixed EUR/BGN peg

llm:
  model_fast: claude-haiku-5-5     # reply classification and fact extraction
  model_strong: claude-sonnet-5-5  # letter rewrites and replies, reading seller documents
  model_review: claude-opus-5-5    # director briefs and their fact-check
  json_retries: 1                  # after that the message escalates to the owner
  # usage.py: USD per million tokens [input, output, cache read, cache write]; check against the pricing page.
  # Haiku is listed at its under-100K-prompt rate, so a long prompt is slightly underestimated.
  prices_usd_per_mtok:
    claude-haiku-5-5: [0.10, 0.50, 0.01, 0.125]
    claude-sonnet-5-5: [2.00, 10.00, 0.20, 2.50]
    claude-opus-5-5: [4.00, 20.00, 0.20, 5.00]
  web_search_usd_per_1000: 10      # the web_search tool is billed per search on top of the tokens

director:                      # brief.py: a summary email per object that is ready for official negotiations
  email: director@example.com  # the real address lives in config.local.yaml
  min_days_left: 60            # a permit or grid deadline closer than this blocks the brief
  remind_days: 7               # a document request goes unanswered this long -> one reminder
  max_attach_mb: 18            # Gmail takes 25 MB including base64

schedule:                      # owner.timezone; the documents pass (deploy/solar-brief.timer) runs 10 minutes later
  mail: ["12:45", "22:45"]     # seller mail and the director's letters are read at these times, or on /mail

limits:
  approvals_before_auto_offer: 10
  new_per_day: 30              # new first letters per day; replies inside a dialog are unlimited
  outreach_per_run: 1          # first letters + follow-ups per run: the run interval is the pause between letters
  send_pause_sec: [60, 180]
  followup_days: [4, 9]        # list length = max follow-ups per contact
  bounce_rate_stop: 0.10

scraping:
  delay_sec: [5, 8]
  host_delay_sec:              # sites with strict rate limits
    www.alo.bg: 20             # returns 429 after ~30 requests at 3-5 s and keeps the block for hours
  user_agent: "Mozilla/5.0 (compatible; SolarBG-search/0.1)"

gmail:
  label: SolarBG
  sender_name: Иван Петров

notify:
  digest_hour: 8               # in owner.timezone
  email_prefix: "[SOLAR]"

sheet_title: "Solar BG: продавцы ФЕЦ 1-3 МВт"

gcp:                           # VM budget cap: budget alert -> Pub/Sub -> the VM powers itself off (budget.py)
  budget_subscription: projects/solar-bg/subscriptions/billing-alerts-vm
  trial_ends: 2027-01-07       # GCP Free Trial end: activate a full account before this date or Google stops the VM
