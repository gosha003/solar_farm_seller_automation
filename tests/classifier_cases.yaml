# Seller replies -> expected final category (after inbox.decide).
# "escalate" = any escalation category (price_discussion..other): what matters is that the owner is alerted urgently.
- {expect: info_provided, text: "Здравейте, централата работи от 2019 г., присъединена мощност 1 MW по договор с ЕРП Север. Цената е 820 000 евро."}
